name: release

# Builds the .deb and AppImage on a version tag, publishes them to a GitHub
# release, and can be run by hand from the Actions tab without publishing.
#
# The runner is pinned to the oldest supported distribution (Ubuntu 24.04) so
# the glibc requirement of the produced binaries stays at 2.39.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      # Use the distribution Python rather than a toolcache build. The
      # distribution build ships a stripped libpython, which keeps the bundled
      # sidecars roughly 20 MB smaller, and it matches what users run.
      - name: Install Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-venv

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Type check and build the UI
        working-directory: desktop
        run: |
          pnpm typecheck
          pnpm build

      - name: Run engine tests
        run: scripts/test-engine.sh

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Distribution Python, not a toolcache build: the distro libpython is
      # stripped, which keeps the bundled sidecars about 20 MB smaller, and it
      # matches what users run.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf wget \
            python3 python3-venv \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version v$version" >&2
            exit 1
          fi

      - name: Build Python sidecars, notices, and licence staging
        run: packaging/build_sidecars.sh

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build the deb and AppImage
        working-directory: desktop
        run: pnpm tauri build --bundles deb,appimage

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/
          cp NOTICES LICENSE dist/
          cd dist
          sha256sum ./*.deb ./*.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: photonic-linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt
            dist/NOTICES
            dist/LICENSE
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          body: |
            Photonic ${{ github.ref_name }}

            Linux x86_64. Tested on Ubuntu 24.04. The builds are not code
            signed, so verify the download first:

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            Install the `.deb` with `sudo apt install ./Photonic_*.deb`, or run
            the AppImage after `chmod +x`. See the README for requirements and
            the first-run steps.

            **Not affiliated with Google.** Photonic uses an unofficial upload
            path and may violate Google's Terms of Service. Use a test or
            secondary account first, and keep independent backups.
